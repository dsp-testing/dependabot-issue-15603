version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      type-checking:
        patterns:
          - "mypy"
          - "django-stubs"
          - "djangorestframework-stubs"
          - "celery-types"
